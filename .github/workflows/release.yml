name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download source tarball and get sha256
        id: sha
        run: |
          curl -sL "https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz" -o source.tar.gz
          echo "sha256=$(sha256sum source.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: wdm0006/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          cd homebrew-tap
          cat > Formula/stargazers.rb << 'FORMULA_EOF'
          # typed: false
          # frozen_string_literal: true

          class Stargazers < Formula
            desc "CLI tool to fetch, analyze, and summarize GitHub stargazers and forkers"
            homepage "https://github.com/wdm0006/stargazers"
            url "https://github.com/wdm0006/stargazers/archive/refs/tags/v${{ steps.version.outputs.version }}.tar.gz"
            sha256 "${{ steps.sha.outputs.sha256 }}"
            license "MIT"

            depends_on "python@3.13"
            depends_on "uv"

            def install
              ENV["UV_CACHE_DIR"] = buildpath/"uv-cache"
              system "uv", "venv", "--python", Formula["python@3.13"].opt_bin/"python3.13", libexec
              system "uv", "pip", "install", "--python", libexec/"bin/python", buildpath
              bin.install_symlink libexec/"bin/stargazers"
            end

            test do
              system bin/"stargazers", "--help"
            end
          end
          FORMULA_EOF

      - name: Commit and push formula
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/stargazers.rb
          git commit -m "Update stargazers to ${{ steps.version.outputs.version }}"
          git push
